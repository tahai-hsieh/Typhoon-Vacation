<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天然災害停班停課統計表</title>
    <style>
        body {
            font-family: "BiauKai", "標楷體", "DFKai-SB", serif;
            margin: 40px;
            background-color: #ffffff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }
        .header-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .status-time {
            font-size: 16px;
            color: #000000;
        }
        /* 標楷體風格的對齊按鈕 */
        .refresh-btn {
            font-family: "BiauKai", "標楷體", "DFKai-SB", serif;
            font-size: 16px;
            padding: 5px 15px;
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            cursor: pointer;
            font-weight: bold;
        }
        .refresh-btn:hover {
            background-color: #f0f0f0;
        }
        .refresh-btn:disabled {
            color: #999999;
            border-color: #999999;
            cursor: not-allowed;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000000;
            padding: 8px 12px;
            text-align: center;
            font-size: 18px;
            color: #000000;
        }
        th {
            font-weight: bold;
        }
        .city-title {
            font-weight: bold;
        }
        .continued {
            font-style: italic;
        }
        .vacation-active {
            color: red !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-tools">
        <div class="status-time">最後及時更新時間：2026/06/10 17:34</div>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">🔄 及時檢查更新</button>
    </div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">縣市</th>
                <th style="width: 25%;">行政區</th>
                <th style="width: 25%;">歷年放假次數</th>
                <th style="width: 25%;">今日有無放假</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<script>
    function checkVacationStatus() {
        const tds = document.querySelectorAll('td');
        tds.forEach(td => {
            if (td.innerText.trim() !== '無' && td.innerText.trim() !== '' && td.cellIndex === 3) {
                td.className = 'vacation-active';
            }
        });
    }

    // 按鈕點擊事件：強迫瀏覽器繞過快取，及時向 GitHub 伺服器抓取最新的網頁內容
    function refreshData() {
        const btn = document.getElementById('refresh-btn');
        btn.disabled = true;
        btn.innerText = "正在及時檢查...";

        // 透過加上時間戳記（Timestamp），強迫瀏覽器及時重新下載最新的 index.html 數據
        fetch(window.location.href + '?t=' + new Date().getTime())
            .then(response => response.text())
            .then(html => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                
                // 及時替換更新時間與表格內容
                document.querySelector('.status-time').innerHTML = doc.querySelector('.status-time').innerHTML;
                document.getElementById('table-body').innerHTML = doc.getElementById('table-body').innerHTML;
                
                // 重新檢查紅字標示
                checkVacationStatus();
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "🔄 及時檢查更新";
                }, 1000);
            })
            .catch(err => {
                console.error("及時更新失敗:", err);
                btn.disabled = false;
                btn.innerText = "🔄 更新失敗，再試一次";
            });
    }

    window.onload = checkVacationStatus;
</script>
</body>
</html>
