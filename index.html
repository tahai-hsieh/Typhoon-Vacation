<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天然災害停班停課統計表</title>
    <style>
        body {
            font-family: "BiauKai", "標楷體", "DFKai-SB", serif;
            margin: 40px;
            background-color: #ffffff;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 10px;
        }
        .status-time {
            text-align: right;
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #000000;
            padding: 8px 12px;
            text-align: center;
            font-size: 18px;
            color: #000000;
        }
        th {
            font-weight: bold;
        }
        .city-title {
            font-weight: bold;
        }
        .continued {
            font-style: italic;
        }
        .vacation-active {
            color: red !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="status-time">最後及時更新時間：2026/06/10 17:34</div>
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">縣市</th>
                <th style="width: 25%;">行政區</th>
                <th style="width: 25%;">歷年放假次數</th>
                <th style="width: 25%;">今日有無放假</th>
            </tr>
        </thead>
        <tbody id="table-body">
            </tbody>
    </table>
</div>

<script>
    // 網頁載入時自動將放假的行政區標示為紅色
    window.onload = function() {
        const tds = document.querySelectorAll('td');
        tds.forEach(td => {
            if (td.innerText.trim() !== '無' && td.innerText.trim() !== '' && td.cellIndex === 3) {
                td.className = 'vacation-active';
            }
        });
    }
</script>
</body>
</html>
