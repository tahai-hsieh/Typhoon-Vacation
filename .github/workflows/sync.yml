name: 全台颱風假及時同步排程

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: 安裝工具
      run: pip install requests beautifulsoup4
    - name: 執行及時同步
      run: python .github/scripts/update_all.py
    - name: 提交並回推網站數據
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add index.html data.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 終極解耦同步：全面刷新 NCDR 國家級即時數據庫" && git push)
