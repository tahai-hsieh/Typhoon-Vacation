name: 全台颱風假及時同步排程

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分鐘自動執行一次後台同步
  workflow_dispatch: # 允許你隨時進後台手動點擊按鈕更新

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: 安裝工具
      run: pip install requests beautifulsoup4
    - name: 執行及時同步
      run: python .github/scripts/update_all.py
    - name: 提交並回推網站
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 終極及時同步：校正全台最新停班停課狀態" && git push)
