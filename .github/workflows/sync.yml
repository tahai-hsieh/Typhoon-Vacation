name: 全台颱風假及時同步排程

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

# 🫵 修正：強制開啟寫入權限，不讓伺服器阻擋機器人回推網頁
permissions: write-all

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4 # 升級新版組件
    - uses: actions/setup-python@v5 # 升級新版組件
      with:
        python-version: '3.10'
    - name: 安裝工具
      run: pip install requests beautifulsoup4
    - name: 執行及時同步
      run: python .github/scripts/update_all.py
    - name: 提交並回推網站
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action Bot"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 終極及時同步：校正全台最新停班停課狀態" && git push)
